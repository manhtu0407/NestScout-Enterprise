project_id = "nestscout-enterprise-agent-local"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 8

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
stack = true

[experimental.pgdelta]
enabled = false
