project_id = "nestscout-enterprise-agent-local"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 8

[storage]
enabled = true
file_size_limit = "5MiB"

[realtime]
enabled = false

[edge_runtime]
enabled = true

[functions.kael.env]
DEEPSEEK_API_KEY = "env(NESTSCOUT_LOCAL_DEEPSEEK_API_KEY)"
ANTHROPIC_API_KEY = "env(NESTSCOUT_LOCAL_ANTHROPIC_API_KEY)"
KAEL_ANTHROPIC_MODEL = "env(NESTSCOUT_LOCAL_KAEL_ANTHROPIC_MODEL)"
KAEL_MODEL_ROUTE = "env(NESTSCOUT_LOCAL_KAEL_MODEL_ROUTE)"
PERPLEXITY_API_KEY = "env(NESTSCOUT_LOCAL_PERPLEXITY_API_KEY)"
KAEL_WEB_SEARCH = "env(NESTSCOUT_LOCAL_KAEL_WEB_SEARCH)"
KAEL_DEVELOPER_PILOT = "env(NESTSCOUT_LOCAL_KAEL_DEVELOPER_PILOT)"
KAEL_DEVELOPER_PILOT_ID = "env(NESTSCOUT_LOCAL_KAEL_DEVELOPER_PILOT_ID)"
KAEL_PILOT_GENERATION = "env(NESTSCOUT_LOCAL_KAEL_PILOT_GENERATION)"
KAEL_PILOT_WORKER_ID = "env(NESTSCOUT_LOCAL_KAEL_PILOT_WORKER_ID)"

[analytics]
enabled = false

[experimental]
stack = true

[experimental.pgdelta]
enabled = false
