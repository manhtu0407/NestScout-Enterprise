name: Repository CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked repository tooling
        run: npm ci --ignore-scripts
      - name: Install checksum-verified tools
        run: npm run tools:install
      - name: Check added source comments on the proposed revision
        run: npm run check:comments
      - name: Check the formatting contract
        run: npm run check:format
      - name: Check hygiene, metadata, documentation, workflows, and secrets
        run: npm run check
      - name: Confirm checks reject invalid fixtures
        run: npm run verify:negative
      - name: Install pinned native Linux optional tools
        run: |
          npm run tools:install -- --tool trivy
          npm run tools:install -- --tool osv-scanner
          npm run tools:install -- --tool k6
      - name: Verify native Linux tools without advisory networking
        run: npm run tools:linux:smoke
      - name: Verify optional hooks on Linux
        run: |
          test -x .githooks/pre-commit
          test -x .githooks/commit-msg
          test -x .githooks/pre-push
          git -c core.hooksPath=.githooks hook run pre-commit
          message=$(mktemp)
          trap 'rm -f "$message"' EXIT
          printf 'chore: verify commit hook\n' > "$message"
          git -c core.hooksPath=.githooks hook run commit-msg -- "$message"
      - name: Write check summary
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          printf '## Repository checks\nStatus: %s\n\nMobile typecheck, lint and unit tests run inside npm run check; native iOS builds, device runs and phone OTP delivery are OUT OF SCOPE for CI.\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Status checks alone do not enforce branch protection; repository rules must be configured separately.\n' >> "$GITHUB_STEP_SUMMARY"

  supabase-local:
    name: Supabase local verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out verification revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Name the isolated verification branch
        run: git switch --create ci-supabase
      - name: Install locked repository tooling
        run: npm ci --ignore-scripts
      - name: Start isolated local Supabase
        id: stack
        run: npm run db:start
      - name: Verify runtime identity and loopback bindings
        run: npm run db:status
      - name: Reset and replay local migrations
        run: npm run db:reset
      - name: Verify local migration history
        run: npm run db:history
      - name: Run database security tests
        run: npm run db:test
      - name: Verify PostgreSQL client read-only workflows
        run: npm run tools:postgresql -- smoke
      - name: Run local MCP integration tests
        run: npm run db:mcp:test
      - name: Lint local database
        run: npm run db:lint
      - name: Verify local schema drift
        run: npm run db:drift
      - name: Verify generated database types
        run: npm run db:types:check
      - name: Typecheck database artifact
        run: npm run typecheck:db
      - name: Stop isolated local stack
        if: ${{ always() && steps.stack.outcome != 'skipped' }}
        run: npm run db:stop
